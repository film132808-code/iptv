name: Update IPTV playlists

# Runs every day at 02:00 UTC (= 08:00 in Dhaka), and can be run by hand.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
          # yt-dlp is optional - used only to re-check which YouTube channels are live
          pip install yt-dlp || true

      - name: Rebuild every playlist
        run: bash update_all.sh

      - name: Commit and push the new playlists
        run: |
          git config user.name  "iptv-updater"
          git config user.email "iptv-updater@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
